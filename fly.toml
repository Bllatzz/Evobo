# fly.toml for apps/api — build context is the repo root (npm workspaces),
# so this file lives at the root and `fly deploy` is run from here. Also
# runs apps/worker's Telegram listener in-process (see server.ts) — one
# machine instead of two, since this is a single-user hobby deployment.
#
# Memory: bumped 512mb -> 1536mb (2026-09-19). Three real-time Telegram
# listeners now share this one box (API + apps/worker's OCR tip listener +
# packages/robotip-legacy's listener, migrated in today) — 512mb caused
# minutes-long delivery lag on tip messages, not total silence (the earlier
# watchdog fix doesn't catch this: lastUpdateAt keeps refreshing, just late).
# Confirmed by timeline: 512mb since 09-17, bumped to 1024mb 12:44 today with
# no reported lag, reverted to 512mb 14:10, lag reappeared by 14:50. Do not
# lower this again without confirming the tip pipeline is still instant.
app = 'evobo-api'
primary_region = 'gru'

[build]
  dockerfile = 'apps/api/Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[deploy]
  strategy = 'immediate'

[[vm]]
  memory = '1536mb'
  cpus = 1
