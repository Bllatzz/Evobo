<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Evobo Betano</title>
    <style>
      /* Cores do Evobo (packages/design-tokens). */
      :root {
        --bg: #08090a;
        --surface: #111315;
        --chip: #16181b;
        --text: #f2f4f3;
        --text2: #c7ccd1;
        --text3: #8a9097;
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.14);
        --accent: #2be08a;
        --accent-soft: rgba(43, 224, 138, 0.1);
        --live: #ff4d5e;
        --live-soft: rgba(255, 77, 94, 0.1);
        --vip: #f5b83d;
      }
      * { box-sizing: border-box; }
      body { width: 360px; margin: 0; padding: 14px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .brand { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
      .brand b { color: var(--accent); }
      .chip { font: 600 10px ui-monospace, monospace; letter-spacing: 0.05em; color: var(--text3); border: 1px solid var(--border-strong); border-radius: 999px; padding: 2px 8px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
      .status { display: flex; align-items: center; gap: 10px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text3); flex: none; }
      .dot.on { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .dot.real { background: var(--vip); box-shadow: 0 0 0 4px rgba(245, 184, 61, 0.15); }
      .dot.bad { background: var(--live); }
      .status .t1 { font-weight: 700; font-size: 14px; }
      .status .t2 { color: var(--text3); font-size: 11.5px; }
      h2 { font-size: 13px; margin: 0 0 8px; }
      .label { font: 10px ui-monospace, monospace; letter-spacing: 0.05em; color: var(--text3); margin: 8px 0 4px; }
      input { width: 100%; background: var(--chip); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 10px; font-size: 13px; outline: none; }
      input:focus { border-color: var(--accent); }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      button { cursor: pointer; font: 600 13px system-ui, sans-serif; border-radius: 11px; padding: 9px 12px; border: 1px solid var(--border-strong); background: transparent; color: var(--text); }
      button.primary { width: 100%; margin-top: 10px; background: var(--accent); color: #08090a; border: none; }
      button.primary:disabled { opacity: 0.5; cursor: default; }
      .hint { color: var(--text3); font-size: 11px; margin-top: 6px; }
      .msg { margin-top: 8px; font-size: 12px; }
      .msg.err { color: var(--live); }
      .result { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
      .badge { display: inline-block; font: 600 9.5px ui-monospace, monospace; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--border-strong); color: var(--text2); }
      .badge.apostou { color: var(--accent); border-color: rgba(43, 224, 138, 0.4); background: var(--accent-soft); }
      .badge.abortou, .badge.erro { color: var(--live); border-color: rgba(255, 77, 94, 0.4); background: var(--live-soft); }
      .badge.verificar { color: var(--vip); border-color: rgba(245, 184, 61, 0.4); }
      .result .txt { white-space: pre-wrap; margin-top: 6px; color: var(--text2); font-size: 12px; }
      .result .when { color: var(--text3); font: 10px ui-monospace, monospace; margin-left: 6px; }
      .grow { flex: 1; min-width: 0; }
      label.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text2); font-size: 12px; cursor: pointer; }
      label.check input { width: auto; accent-color: var(--accent); }
      .toggle { width: 46px; height: 27px; padding: 3px; border: none; border-radius: 999px; background: var(--chip); display: flex; justify-content: flex-start; flex: none; }
      .toggle span { width: 21px; height: 21px; border-radius: 50%; background: var(--text3); }
      .toggle[aria-pressed="true"] { background: var(--accent); justify-content: flex-end; }
      .toggle[aria-pressed="true"] span { background: #08090a; }
      .toggle:disabled { opacity: 0.5; }
      [hidden] { display: none !important; }
      .foot { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
      .foot a, button.link { color: var(--text3); font-size: 11.5px; text-decoration: none; background: none; border: none; padding: 0; font-weight: 500; }
      details summary { cursor: pointer; color: var(--text3); font-size: 12px; font-weight: 600; list-style: none; }
      details summary::before { content: "▸ "; }
      details[open] summary::before { content: "▾ "; }
      pre { white-space: pre-wrap; background: var(--chip); border-radius: 8px; padding: 8px; max-height: 180px; overflow: auto; font-size: 10.5px; color: var(--text3); }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="brand">evo<b>bo</b></span>
      <span class="chip">BETANO</span>
    </div>

    <!-- Liga/desliga. Modo, teto, logins e histórico ficam no Evobo. -->
    <div class="card">
      <div class="status">
        <span class="dot" id="dot"></span>
        <div class="grow">
          <div class="t1" id="statusTitulo">…</div>
          <div class="t2" id="statusSub"></div>
        </div>
        <button class="toggle" id="toggle" aria-pressed="false" aria-label="Ligar ou desligar" hidden><span></span></button>
      </div>
      <div class="msg err" id="statusErro"></div>
    </div>

    <div class="card">
      <h2>Testar um link</h2>
      <div class="label">LINK DA BETANO (DA MENSAGEM)</div>
      <input id="link" placeholder="https://www.betano.bet.br/bookingcode/…" />
      <div class="row">
        <div><div class="label">ODD DA TIP</div><input id="odd" placeholder="2,12" inputmode="decimal" /></div>
        <div><div class="label">UNIDADES</div><input id="unit" placeholder="1,5" inputmode="decimal" /></div>
      </div>
      <label class="check"><input type="checkbox" id="aumento" checked /> Tip com aumento (liga a CA Turbinada)</label>
      <button class="primary" id="testarLink">Abrir e conferir</button>
      <div class="hint">Loga se precisar, confere a odd e preenche a stake — <b>nunca aposta</b>.</div>
      <div class="msg" id="statusTeste"></div>
    </div>

    <!-- Só aparece sem chave ou com chave inválida (ou pelo "trocar chave"). -->
    <div class="card" id="conexao" hidden>
      <h2>Conectar ao Evobo</h2>
      <div class="label">CHAVE (EVOBO → APOSTA AUTOMÁTICA → LOGIN DAS CASAS)</div>
      <input id="token" type="password" placeholder="evx_…" autocomplete="off" />
      <button class="primary" id="salvar">Salvar</button>
      <div class="msg" id="statusConexao"></div>
    </div>
    <div class="foot">
      <a href="https://evobo.vercel.app/auto-betting" target="_blank">Configurar no Evobo ↗</a>
      <button class="link" id="trocarChave">trocar chave</button>
    </div>

    <script src="summary.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
