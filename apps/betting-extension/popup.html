<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Evobo Betano</title>
    <style>
      body { width: 440px; font: 13px system-ui, sans-serif; margin: 12px; }
      label { display: block; margin: 6px 0 2px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 4px 6px; }
      textarea { width: 100%; height: 150px; font: 12px ui-monospace, monospace; box-sizing: border-box; }
      button { margin: 6px 6px 0 0; padding: 6px 10px; cursor: pointer; }
      pre { white-space: pre-wrap; background: #f4f4f5; padding: 8px; max-height: 200px; overflow: auto; font-size: 11.5px; }
      .aviso { color: #92400e; background: #fef3c7; padding: 6px 8px; border-radius: 4px; }
      .status { margin: 8px 0; font-weight: 700; }
      .entrada { border: 1px solid #e4e4e7; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
      .entrada .titulo { font-weight: 600; }
      .ok { color: #15803d; } .skip { color: #b91c1c; } .neutro { color: #52525b; }
      details { margin-top: 10px; }
    </style>
  </head>
  <body>
    <p class="aviso">Dry-run: abre o link, confere a odd e preenche a stake — <b>nunca aposta</b>.</p>

    <label for="apiUrl">API do Evobo</label>
    <input id="apiUrl" />
    <label for="token">Chave da extensão (gerada no seu perfil do Evobo → Aposta automática)</label>
    <input id="token" type="password" />
    <label for="maxStake">Teto por aposta (R$)</label>
    <input id="maxStake" type="number" min="1" step="1" />

    <label for="unitValue">Valor da unidade (R$)</label>
    <input id="unitValue" type="number" min="1" step="0.5" />
    <button id="salvar">Salvar</button>

    <h4>Testar um link</h4>
    <label for="link">Link da Betano (da mensagem)</label>
    <input id="link" placeholder="https://www.betano.bet.br/bookingcode/…" />
    <div style="display: flex; gap: 8px">
      <div style="flex: 1"><label for="odd">Odd da tip</label><input id="odd" placeholder="2,12" /></div>
      <div style="flex: 1"><label for="unit">Unidades</label><input id="unit" placeholder="1,5" /></div>
    </div>
    <button id="testarLink">Abrir e conferir</button>
    <div class="status" id="statusTeste"></div>

    <h4>Automático (precisa da API)</h4>
    <div class="status" id="status"></div>
    <button id="ligar">Ligar (tips novas)</button>
    <button id="desligar">Desligar</button>
    <br />
    <button id="testar">Testar agora com tips das últimas</button>
    <input id="horas" type="number" min="1" max="24" value="3" style="width: 50px" /> h

    <h4>Histórico</h4>
    <div id="log"></div>

    <details>
      <summary>Modo manual (JSON na aba atual)</summary>
      <textarea id="task" spellcheck="false"></textarea>
      <button id="rodar">Rodar dry-run na aba da Betano</button>
      <pre id="saida"></pre>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
